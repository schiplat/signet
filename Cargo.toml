[workspace]
resolver = "2"
members = ["crates/signet"]

[workspace.package]
version = "0.4.3"
edition = "2021"
license = "MIT"

[workspace.dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
jsonwebtoken = "9"
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
mime_guess = "2"
password-hash = "0.5"
rand = "0.8"
rsa = { version = "0.9", features = ["pem", "std"] }
rust-embed = "8"
# Same version ldap3/reqwest already resolve to; only used to build an explicit
# LDAPS ClientConfig (self-signed CA support) and to pick the crypto provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
urlencoding = "2"
totp-rs = { version = "5.7", features = ["otpauth", "gen_secret"] }
data-encoding = "2"
hmac = "0.12"
ipnet = "2"

# Test-only. `tower` (not `tower-http`) is what drives a handler in a test via
# `ServiceExt::oneshot`; `http-body-util` reads the response body back. Both are
# already in the graph through axum, so this pins the same versions rather than
# adding anything new to the build.
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
