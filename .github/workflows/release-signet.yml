name: Build Signet Image

# Runs only after Release Signet Binary succeeds (or on manual dispatch).
# Packages the already-built linux/amd64 binary into an ACR image and uploads
# the deploy config bundle to OSS. Does not compile Rust or the dashboard.
on:
  workflow_run:
    workflows: ["Release Signet Binary"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag / GitHub Release version (e.g. 0.4.3 or v0.4.3)'
        required: true
        type: string

concurrency:
  group: signet-image-${{ github.event.workflow_run.head_sha || inputs.version || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  docker:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default; pin to the
          # commit that produced the binaries so Dockerfile/deploy match.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          v="${{ inputs.version }}"
          if [[ -z "${v}" ]]; then
            head="${{ github.event.workflow_run.head_branch }}"
            if [[ "${head}" == v* ]]; then
              v="${head}"
            fi
          fi
          if [[ -z "${v}" ]]; then
            v="$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          fi
          v="${v#v}"
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "tag=v${v}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${v}"

      - name: Validate ACR configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${ACR_REGISTRY:?ACR_REGISTRY secret missing}"
          : "${ACR_NAMESPACE:?ACR_NAMESPACE secret missing}"
          : "${ACR_REPOSITORY:?ACR_REPOSITORY secret missing}"
          : "${ACR_USERNAME:?ACR_USERNAME secret missing}"
          : "${ACR_PASSWORD:?ACR_PASSWORD secret missing}"
          echo "ACR target: ${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}"
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}

      - name: Download linux-amd64 from binary workflow
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: image-context
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download linux-amd64 from GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p image-context
          gh release download "${TAG}" \
            --pattern "signet-*-linux-amd64" \
            --dir image-context

      - name: Stage binary for Docker context
        shell: bash
        run: |
          set -euo pipefail
          cd image-context
          bin="$(ls -1 signet-*-linux-amd64 | head -1)"
          mv "${bin}" signet
          chmod +x signet
          ls -la

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ vars.ACR_REPOSITORY }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest

      - name: Build and push (linux/amd64, binary-only)
        uses: docker/build-push-action@v6
        with:
          context: image-context
          file: build/Dockerfile.runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=min,ignore-error=true

      # ── Config bundle → OSS (config-as-code for the Buz deploy pipeline) ──
      - name: Install ossutil
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
          ossutil --version

      - name: Package and upload config bundle to OSS
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          OSS_AK: ${{ secrets.OSS_AK }}
          OSS_SK: ${{ secrets.OSS_SK }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
        run: |
          set -euo pipefail

          : "${OSS_AK:?OSS_AK secret missing — add Actions secret OSS_AK}"
          : "${OSS_SK:?OSS_SK secret missing — add Actions secret OSS_SK}"
          : "${OSS_BUCKET:?OSS_BUCKET secret missing}"
          : "${OSS_ENDPOINT:?OSS_ENDPOINT secret missing}"

          tar czf configs.tar.gz -C deploy docker-compose.yml env.tpl
          echo "==> Bundle contents:"
          tar tzf configs.tar.gz
          echo "==> OSS target: oss://${OSS_BUCKET}/config_tpl/signet/${VERSION}/configs.tar.gz"

          ossutil cp -f configs.tar.gz \
            "oss://${OSS_BUCKET}/config_tpl/signet/${VERSION}/configs.tar.gz" \
            --access-key-id "${OSS_AK}" --access-key-secret "${OSS_SK}" \
            --endpoint "${OSS_ENDPOINT}" --meta "x-oss-meta-buz-tag:${VERSION}"

          echo "==> Uploaded tag bundle: config_tpl/signet/${VERSION}/configs.tar.gz"
