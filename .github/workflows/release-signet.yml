name: Build Signet Image

# Packages the linux/amd64 binary produced by release-binary.yml into an ACR
# image and uploads the deploy config bundle to OSS. Does NOT compile Rust or
# the dashboard again — that work already happened in release-binary.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag override (default: git tag or Cargo.toml version)'
        required: false
        type: string
  push:
    tags:
      - 'v*'
    paths:
      - 'crates/**'
      - 'dashboard/**'
      - 'migrations/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build/**'
      - 'deploy/**'
      - '.github/workflows/release-signet.yml'
      - '.github/workflows/release-binary.yml'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Compile once (multi-arch binaries + GitHub Release assets).
  binary:
    uses: ./.github/workflows/release-binary.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  docker:
    needs: binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.binary.outputs.version }}"
          if [[ -z "${v}" ]]; then
            if [[ -n "${{ inputs.version }}" ]]; then
              v="${{ inputs.version }}"
              v="${v#v}"
            elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              v="${GITHUB_REF#refs/tags/v}"
            else
              v="$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
            fi
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${v}"

      - name: Validate ACR configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${ACR_REGISTRY:?ACR_REGISTRY secret missing}"
          : "${ACR_NAMESPACE:?ACR_NAMESPACE secret missing}"
          : "${ACR_REPOSITORY:?ACR_REPOSITORY secret missing}"
          : "${ACR_USERNAME:?ACR_USERNAME secret missing}"
          : "${ACR_PASSWORD:?ACR_PASSWORD secret missing}"
          echo "ACR target: ${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}"
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}

      # Reuse the linux/amd64 artifact from the binary job — no second cargo build.
      - name: Download linux-amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: image-context

      - name: Stage binary for Docker context
        shell: bash
        run: |
          set -euo pipefail
          cd image-context
          bin="$(ls -1 signet-*-linux-amd64 | head -1)"
          mv "${bin}" signet
          chmod +x signet
          ls -la

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ vars.ACR_REPOSITORY }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest

      - name: Build and push (linux/amd64, binary-only)
        uses: docker/build-push-action@v6
        with:
          context: image-context
          file: build/Dockerfile.runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=min,ignore-error=true

      # ── Config bundle → OSS (config-as-code for the Buz deploy pipeline) ──
      - name: Install ossutil
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
          ossutil --version

      - name: Package and upload config bundle to OSS
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          OSS_AK: ${{ secrets.OSS_AK }}
          OSS_SK: ${{ secrets.OSS_SK }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
        run: |
          set -euo pipefail

          : "${OSS_AK:?OSS_AK secret missing — add Actions secret OSS_AK}"
          : "${OSS_SK:?OSS_SK secret missing — add Actions secret OSS_SK}"
          : "${OSS_BUCKET:?OSS_BUCKET secret missing}"
          : "${OSS_ENDPOINT:?OSS_ENDPOINT secret missing}"

          tar czf configs.tar.gz -C deploy docker-compose.yml env.tpl
          echo "==> Bundle contents:"
          tar tzf configs.tar.gz
          echo "==> OSS target: oss://${OSS_BUCKET}/config_tpl/signet/${VERSION}/configs.tar.gz"

          ossutil cp -f configs.tar.gz \
            "oss://${OSS_BUCKET}/config_tpl/signet/${VERSION}/configs.tar.gz" \
            --access-key-id "${OSS_AK}" --access-key-secret "${OSS_SK}" \
            --endpoint "${OSS_ENDPOINT}" --meta "x-oss-meta-buz-tag:${VERSION}"

          echo "==> Uploaded tag bundle: config_tpl/signet/${VERSION}/configs.tar.gz"
