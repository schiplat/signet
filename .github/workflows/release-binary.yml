name: Release Signet Binary

# Tag (or manual dispatch) builds multi-arch binaries with the dashboard
# embedded and publishes them to a GitHub Release. Build Signet Image waits
# for this workflow to succeed via workflow_run — it does not compile again.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Binary version override (default: git tag or Cargo.toml version)'
        required: false
        type: string

concurrency:
  group: release-binary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          input_ver="${{ inputs.version }}"
          if [[ -n "${input_ver}" ]]; then
            v="${input_ver}"
            v="${v#v}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            v="$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${v}"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-15
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      # The signet binary embeds the Vue dashboard via rust-embed, so
      # dashboard/dist must exist before cargo build.
      - name: Build dashboard
        working-directory: dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build binary
        run: cargo build --release -p signet

      - name: Stage binary
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          name="signet-${{ needs.meta.outputs.version }}-${{ matrix.name }}"
          cp target/release/signet "$name"
          chmod +x "$name"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ steps.stage.outputs.name }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/signet-*
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.meta.outputs.version) }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
