name: Build Signet Image

# Runs only after Release Signet Binary succeeds (or on manual dispatch).
# Packages the already-built linux/amd64 and linux/arm64 binaries into a
# multi-arch image and pushes it to ACR and Docker Hub. Does not compile Rust or
# the dashboard, and does not publish deployment configuration — consumers
# provide `.env` / environment variables through their own pipeline.
#
# Required secrets / vars:
#   ACR: ACR_REGISTRY, ACR_NAMESPACE, ACR_USERNAME, ACR_PASSWORD (secrets)
#        ACR_REPOSITORY (var)
#   Docker Hub: DOCKERHUB_USERNAME (var), DOCKERHUB_TOKEN (secret)
#               image → ${DOCKERHUB_USERNAME}/signet
on:
  workflow_run:
    workflows: ["Release Signet Binary"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag / GitHub Release version (e.g. 0.6.4 or v0.6.4)'
        required: true
        type: string

concurrency:
  group: signet-image-${{ github.event.workflow_run.head_sha || inputs.version || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  docker:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default; pin to the
          # commit that produced the binaries so Dockerfile/deploy match.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          v="${{ inputs.version }}"
          if [[ -z "${v}" ]]; then
            head="${{ github.event.workflow_run.head_branch }}"
            if [[ "${head}" == v* ]]; then
              v="${head}"
            fi
          fi
          if [[ -z "${v}" ]]; then
            v="$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          fi
          v="${v#v}"
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "tag=v${v}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${v}"

      - name: Validate registry configuration
        id: regs
        shell: bash
        run: |
          set -euo pipefail
          : "${ACR_REGISTRY:?ACR_REGISTRY secret missing}"
          : "${ACR_NAMESPACE:?ACR_NAMESPACE secret missing}"
          : "${ACR_REPOSITORY:?ACR_REPOSITORY var missing}"
          : "${ACR_USERNAME:?ACR_USERNAME secret missing}"
          : "${ACR_PASSWORD:?ACR_PASSWORD secret missing}"
          : "${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME var missing}"
          : "${DOCKERHUB_TOKEN:?DOCKERHUB_TOKEN secret missing}"

          acr_image="${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}"
          hub_image="${DOCKERHUB_USERNAME}/signet"
          echo "acr_image=${acr_image}" >> "$GITHUB_OUTPUT"
          echo "hub_image=${hub_image}" >> "$GITHUB_OUTPUT"
          echo "ACR target: ${acr_image}"
          echo "Docker Hub target: ${hub_image}"
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download Linux binaries from binary workflow
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: image-context
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Linux binaries from GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p image-context
          gh release download "${TAG}" \
            --pattern "signet-*-linux-amd64" \
            --dir image-context
          gh release download "${TAG}" \
            --pattern "signet-*-linux-arm64" \
            --dir image-context

      - name: Stage binaries for the multi-arch build
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            mkdir -p "image-context/linux/${arch}"
            bin="$(ls -1 image-context/signet-*-linux-${arch} | head -1)"
            mv "${bin}" "image-context/linux/${arch}/signet"
            chmod +x "image-context/linux/${arch}/signet"
          done
          # The Dockerfile copies linux/<TARGETARCH>/signet; drop the
          # versioned duplicates so the build context stays small.
          rm -f image-context/signet-*-linux-*
          find image-context -maxdepth 3 -type f -ls

      # The runtime stage runs apt-get and useradd for each target platform;
      # QEMU lets the amd64 runner execute those arm64 instructions.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # One build, two registries (ACR + Docker Hub).
          images: |
            ${{ steps.regs.outputs.acr_image }}
            ${{ steps.regs.outputs.hub_image }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest

      - name: Build and push multi-arch image (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: image-context
          file: build/Dockerfile.runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=min,ignore-error=true
