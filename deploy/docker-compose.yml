# Signet production deploy stack (image pull, no build).
#
# Primary path: inject the startup-critical variables from the shell / Buz:
#   SIGNET_IMAGE=... SIGNET_DATABASE_URL=... docker compose up -d
#
# A dotenv file is still supported as an optional compatibility layer:
#   cp ../.env.example .env
#   docker compose -f docker-compose.yml -f docker-compose.env-file.yml up -d
#
# First run (no admin yet): open https://<issuer>/ in a browser — the dashboard
# redirects to /setup where you create the first administrator (email, optional
# display name, password).
#
# signet connects to an EXISTING PostgreSQL via SIGNET_DATABASE_URL. No
# database is started here — the `db` service in build/docker-compose.yml is a
# local-dev convenience only.
#
# On the production host, signet joins the `manager-net` Docker network created by the
# super-manager stack, so the database host is `postgres`:
#   postgres://<user>:<password>@postgres:5432/signet
# Signet connects as a dedicated, least-privilege `signet` role — NOT the
# cluster superuser. One-time setup (run as the cluster superuser):
#   docker exec -it manager-postgres psql -U postgres -c "CREATE ROLE signet LOGIN PASSWORD '<app-password>';"
#   docker exec -it manager-postgres psql -U postgres -c "CREATE DATABASE signet OWNER signet;"
#
# Compose still reads deploy/.env for ${VAR} substitution when present; that is
# interpolation, not a requirement. The env_file compatibility overlay is
# documented in docker-compose.env-file.yml.

services:
  signet:
    image: ${SIGNET_IMAGE:?SIGNET_IMAGE must be set (e.g. <registry>/<namespace>/signet:<tag>)}
    container_name: signet
    restart: unless-stopped
    environment:
      # Required: fail closed instead of falling back to the built-in
      # localhost/signet default. Buz supplies this from a Secret.
      SIGNET_DATABASE_URL: ${SIGNET_DATABASE_URL:?SIGNET_DATABASE_URL must be set}
      # Startup-only settings that cannot be changed from the dashboard. They
      # default to the application's own defaults; production deployments
      # should set the real issuer, proxy range and WebAuthn origin.
      SIGNET_ISSUER: ${SIGNET_ISSUER:-http://localhost:8443}
      SIGNET_COOKIE_SECURE: ${SIGNET_COOKIE_SECURE:-false}
      SIGNET_TRUSTED_PROXIES: ${SIGNET_TRUSTED_PROXIES:-}
      SIGNET_WEBAUTHN_RP_ID: ${SIGNET_WEBAUTHN_RP_ID:-localhost}
      SIGNET_WEBAUTHN_RP_ORIGIN: ${SIGNET_WEBAUTHN_RP_ORIGIN:-http://localhost:8443}
    ports:
      # Host firewall / reverse proxy restricts access — do NOT expose to the
      # public internet without TLS termination in front (SSO issuer requires
      # HTTPS; see SIGNET_ISSUER / SIGNET_COOKIE_SECURE in .env.example).
      # Set SIGNET_PORT_BIND=127.0.0.1 when the reverse proxy runs on the same
      # host: then the port is unreachable from the network even if the
      # firewall rule is lost. The default keeps the old behavior so an
      # existing deployment does not lose its proxy.
      - "${SIGNET_PORT_BIND:-0.0.0.0}:8443:8443"
    volumes:
      # Persists the JWT signing key and the encryption key. Do NOT lose this
      # volume: rotating keys invalidates issued tokens and stored TOTP secrets.
      - signet_data:/app/data
    healthcheck:
      # /health answers 503 when the database is unreachable, so orchestration
      # restarts a container that is up but cannot serve. Bash's /dev/tcp keeps
      # this working in the slim runtime image (no curl/wget installed).
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8443 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -n1 <&3 | grep -q 200'",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - manager-net
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

volumes:
  signet_data:

networks:
  manager-net:
    external: true
