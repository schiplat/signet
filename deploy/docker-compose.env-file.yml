# Optional dotenv compatibility layer — not the primary deployment path.
#
# Use it alongside the base file:
#   docker compose -f docker-compose.yml -f docker-compose.env-file.yml up -d
#
# The base file injects the startup-critical variables through `environment:`.
# This overlay additionally loads deploy/.env into the container, which is
# useful for the wider settings surface (SMTP, metrics, optional integrations)
# and for existing dotenv-based deployments. Variables declared in the base
# file's `environment:` block win over the same keys in `.env`.

services:
  signet:
    env_file:
      - .env
